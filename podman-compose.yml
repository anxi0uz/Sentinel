x-app-environment: &app-environment
  SENTINEL_KAFKA_BROKERS: kafka:29092
  SENTINEL_DATABASE_HOST: postgres
  SENTINEL_DATABASE_PORT: 5432
  SENTINEL_DATABASE_USER: ${SENTINEL_DATABASE_USER}
  SENTINEL_DATABASE_PASSWORD: ${SENTINEL_DATABASE_PASSWORD}
  SENTINEL_DATABASE_NAME: ${SENTINEL_DATABASE_NAME}
  SENTINEL_DATABASE_SSLMODE: disable

services:
  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.7.1
    container_name: sentinel-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.7.1
    container_name: sentinel-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: sentinel-postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${SENTINEL_DATABASE_USER}
      POSTGRES_PASSWORD: ${SENTINEL_DATABASE_PASSWORD}
      POSTGRES_DB: ${SENTINEL_DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SENTINEL_DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  transaction-gateway:
    build:
      context: .
      dockerfile: services/transaction-gateway/Dockerfile
    container_name: sentinel-transaction-gateway
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment: *app-environment
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  scoring-engine:
    build:
      context: .
      dockerfile: services/scoring-engine/Dockerfile
    container_name: sentinel-scoring-engine
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment: *app-environment

  alert-service:
    build:
      context: .
      dockerfile: services/alert-service/Dockerfile
    container_name: sentinel-alert-service
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment: *app-environment

volumes:
  postgres_data:

networks:
  default:
    name: sentinel-network
